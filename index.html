<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Voice Lab</title>
<style>
*{box-sizing:border-box}
body{margin:0;padding:20px 16px 110px;font-family:Arial,sans-serif;color:white;background:linear-gradient(#29b8ed,#009cdb);min-height:100vh}
header{text-align:center;font-size:25px;font-weight:bold;margin:10px 0 22px}
.page{display:none;max-width:520px;margin:auto}
.page.active{display:block}
.card{background:#ffffff20;border:1px solid #ffffff55;border-radius:24px;padding:23px 18px;margin:18px 0;box-shadow:0 8px 20px #006a9125}
.hero{text-align:center;padding:30px 15px}
.robot{font-size:65px}
h2{font-size:23px;margin:12px 0}
p{opacity:.85}
.mic{width:145px;height:145px;border-radius:50%;background:#20c981;border:7px solid #8be7b3;font-size:48px;color:white;display:block;margin:25px auto 12px}
button{cursor:pointer}
.status{text-align:center;min-height:22px;font-size:14px;margin-top:12px}
input,textarea,select{width:100%;padding:13px;border:0;border-radius:12px;font-size:16px;margin:8px 0;color:#17313b}
.action{padding:13px 18px;border:0;border-radius:12px;background:#063343;color:white;font-weight:bold;margin:5px}
.row{display:flex;justify-content:center;align-items:center;gap:12px;flex-wrap:wrap}
.nav{position:fixed;bottom:15px;left:50%;transform:translateX(-50%);display:flex;gap:5px;width:min(92%,360px);padding:8px;background:#032431;border:2px solid #47616a;border-radius:55px}
.tab{flex:1;border:0;border-radius:35px;background:transparent;color:#c4d4d9;padding:12px 4px;font-size:12px}
.tab span{display:block;font-size:24px;margin-bottom:4px}
.tab.active{background:#4b6872;color:white}
.score{font-size:24px;font-weight:bold;text-align:center}
.track{display:block;width:100%;text-align:left;padding:14px;border-radius:12px;border:0;background:#ffffff25;color:white;margin:8px 0}
small{opacity:.8}
</style>
</head>
<body>

<header>⚡ VOICE LAB</header>

<section id="voice" class="page active">
  <div class="card hero">
    <div class="robot">🤖</div>
    <h2>Tap Mic & Speak to Match</h2>
    <p>Fun Voice Matcher</p>
  </div>
  <button class="mic" id="record">🎙️</button>
  <div class="status" id="voiceStatus">Tap the mic and speak</div>
  <div class="card">
    <div class="score" id="score">0%</div>
    <p style="text-align:center">Voice Match Score</p>
    <div id="heard" style="text-align:center"></div>
    <h2 id="match" style="text-align:center"></h2>
    <p id="matchInfo" style="text-align:center"></p>
  </div>
</section>

<section id="meme" class="page">
  <div class="card hero">
    <div class="robot">🎭</div>
    <h2>Meme Talk</h2>
    <p>Type something and hear your robot voice.</p>
  </div>
  <div class="card">
    <textarea id="memeText" rows="4">Hello human! I am your meme robot.</textarea>
    <label for="style">Voice style</label>
    <select id="style">
      <option value="robot">Robot</option>
      <option value="deep">Deep narrator</option>
      <option value="fast">Fast funny voice</option>
      <option value="normal">Normal</option>
    </select>
    <div class="row">
      <button class="action" id="speak">▶ Speak</button>
      <button class="action" id="stop">■ Stop</button>
    </div>
    <div class="status" id="memeStatus">Ready</div>
  </div>
</section>

<section id="music" class="page">
  <div class="card hero">
    <div class="robot" id="cover">🎧</div>
    <h2 id="songTitle">Sunny Day</h2>
    <p id="songArtist">Sample music</p>
    <audio id="audio" preload="none"></audio>
    <div class="row">
      <button class="action" id="prev">⏮ Previous</button>
      <button class="action" id="play">▶ Play</button>
      <button class="action" id="next">Next ⏭</button>
    </div>
    <div class="status" id="musicStatus">Choose Play to start</div>
  </div>
  <div class="card">
    <h2>Playlist</h2>
    <button class="track" data-track="0">☀️ Sunny Day</button>
    <button class="track" data-track="1">🌙 Night Drive</button>
    <button class="track" data-track="2">🌊 Chill Waves</button>
    <small>Music needs an internet connection.</small>
  </div>
</section>

<nav class="nav">
  <button class="tab active" data-page="voice"><span>🎙️</span>VOICE</button>
  <button class="tab" data-page="meme"><span>🎭</span>MEME TALK</button>
  <button class="tab" data-page="music"><span>♫</span>MUSIC</button>
</nav>

<script>
const $ = id => document.getElementById(id);

// Navigation tabs
document.querySelectorAll(".tab").forEach(button => {
  button.addEventListener("click", () => {
    document.querySelectorAll(".tab").forEach(t => t.classList.remove("active"));
    document.querySelectorAll(".page").forEach(p => p.classList.remove("active"));
    button.classList.add("active");
    $(button.dataset.page).classList.add("active");
    if ("speechSynthesis" in window) speechSynthesis.cancel();
  });
});

// Voice Matcher
const SpeechRec = window.SpeechRecognition || window.webkitSpeechRecognition;
let rec = null;
$("record").addEventListener("click", () => {
  if (!SpeechRec) {
    $("voiceStatus").textContent = "Voice recognition not supported. Try Chrome.";
    return;
  }
  try {
    rec = new SpeechRec();
    rec.lang = "hi-IN";
    rec.interimResults = false;
    $("voiceStatus").textContent = "Listening... Speak now!";
    $("record").textContent = "🔴";
    rec.onresult = e => {
      const words = e.results[0][0].transcript;
      $("heard").textContent = "Heard: " + words;
      const lower = words.toLowerCase();
      let name = "Cartoon Robot 🤖";
      let info = "Your phrase matched a playful robot style.";
      if (/hello|namaste|dost|hain|kaun/.test(lower)) {
        name = "Amitabh-style dramatic voice 🎬";
        info = "A fun text-based style match.";
      } else if (/love|pyaar|dil|heart/.test(lower)) {
        name = "Romantic movie narrator ⭐";
        info = "A fun text-based style match.";
      } else if (/music|story|beautiful/.test(lower)) {
        name = "Calm narrator 🎧";
        info = "A fun text-based style match.";
      }
      $("score").textContent = (65 + Math.floor(Math.random()*30)) + "%";
      $("match").textContent = name;
      $("matchInfo").textContent = info;
      $("voiceStatus").textContent = "Voice match complete!";
    };
    rec.onerror = e => {
      $("voiceStatus").textContent =
        e.error === "not-allowed"
        ? "Allow microphone permission in browser settings."
        : "Couldn't hear you. Try again with internet on.";
    };
    rec.onend = () => $("record").textContent = "🎙️";
    rec.start();
  } catch(e) {
    $("voiceStatus").textContent = "Open in Chrome and allow microphone access.";
    $("record").textContent = "🎙️";
  }
});

// Meme Talk: uses the device's built-in speech engine
$("speak").addEventListener("click", () => {
  const text = $("memeText").value.trim();
  if (!text) {
    $("memeStatus").textContent = "Please type something first.";
    return;
  }
  if (!("speechSynthesis" in window)) {
    $("memeStatus").textContent = "Text-to-speech isn't supported here.";
    return;
  }
  speechSynthesis.cancel();
  const utter = new SpeechSynthesisUtterance(text);
  const style = $("style").value;
  utter.pitch = style === "robot" ? 1.7 : style === "deep" ? 0.55 : style === "fast" ? 1.3 : 1;
  utter.rate = style === "fast" ? 1.5 : 1;
  utter.onstart = () => $("memeStatus").textContent = "Speaking...";
  utter.onend = () => $("memeStatus").textContent = "Finished!";
  utter.onerror = () => $("memeStatus").textContent = "Speech could not play. Try again.";
  speechSynthesis.speak(utter);
});
$("stop").addEventListener("click", () => {
  if ("speechSynthesis" in window) speechSynthesis.cancel();
  $("memeStatus").textContent = "Stopped.";
});

// Music Player
const songs = [
  {title:"Sunny Day",artist:"Sample instrumental",emoji:"☀️",url:"https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3"},
  {title:"Night Drive",artist:"Sample instrumental",emoji:"🌙",url:"https://www.soundhelix.com/examples/mp3/SoundHelix-Song-2.mp3"},
  {title:"Chill Waves",artist:"Sample instrumental",emoji:"🌊",url:"https://www.soundhelix.com/examples/mp3/SoundHelix-Song-3.mp3"}
];
let index = 0;
const audio = $("audio");
function loadSong(i, autoPlay=false) {
  index = (i + songs.length) % songs.length;
  const song = songs[index];
  $("songTitle").textContent = song.title;
  $("songArtist").textContent = song.artist;
  $("cover").textContent = song.emoji;
  audio.src = song.url;
  $("musicStatus").textContent = "Selected: " + song.title;
  $("play").textContent = "▶ Play";
  document.querySelectorAll(".track").forEach((b,n) => {
    b.style.background = n === index ? "#063343" : "#ffffff25";
  });
  if (autoPlay) playSong();
}
async function playSong() {
  try {
    await audio.play();
    $("play").textContent = "⏸ Pause";
    $("musicStatus").textContent = "Playing: " + songs[index].title;
  } catch(e) {
    $("musicStatus").textContent = "Audio couldn't load. Check internet and try again.";
  }
}
$("play").addEventListener("click", () => {
  if (audio.paused) playSong();
  else {
    audio.pause();
    $("play").textContent = "▶ Play";
    $("musicStatus").textContent = "Paused";
  }
});
$("next").addEventListener("click", () => loadSong(index+1, true));
$("prev").addEventListener("click", () => loadSong(index-1, true));
document.querySelectorAll(".track").forEach(button => {
  button.addEventListener("click", () => loadSong(Number(button.dataset.track), true));
});
audio.addEventListener("ended", () => loadSong(index+1, true));
audio.addEventListener("error", () => {
  if (audio.src) $("musicStatus").textContent = "Track failed. Check internet or choose another.";
});
loadSong(0);
</script>
</body>
</html>
