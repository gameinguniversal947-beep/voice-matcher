<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1350" width="100%" height="100%" style="background-color: #030712; font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGlow" cx="50%" cy="10%" r="60%">
      <stop offset="0%" stop-color="#16a34a" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#030712" stop-opacity="1" />
    </radialGradient>

    <!-- Card Gradient -->
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>

    <!-- Neon Green Button Gradient -->
    <linearGradient id="btnGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#22c55e" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>

    <!-- Gold Accent Gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>

    <!-- Card Border Gradient -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#334155" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>

    <!-- Glow Effect Filter -->
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="1350" fill="url(#bgGlow)" />

  <!-- Mobile Frame Container -->
  <rect x="50" y="40" width="700" height="1270" rx="44" fill="#0f172a" stroke="#1e293b" stroke-width="6" />

  <!-- App Header / Status Bar Area -->
  <g transform="translate(90, 80)">
    <!-- Top Left: ID Number & Profile -->
    <g>
      <circle cx="36" cy="36" r="32" fill="#1e293b" stroke="#22c55e" stroke-width="2" />
      <!-- User Silhouette Icon -->
      <path d="M36 22 A10 10 0 1 0 36 42 A10 10 0 1 0 36 22 Z M20 58 C20 48 27 44 36 44 C45 44 52 48 52 58 Z" fill="#4ade80" />
      
      <text x="82" y="32" fill="#ffffff" font-size="22" font-weight="800" letter-spacing="0.5">+91 83***1015</text>
      
      <!-- UPI Verified Badge -->
      <rect x="82" y="42" width="105" height="24" rx="6" fill="#16a34a" fill-opacity="0.2" stroke="#22c55e" stroke-width="1" />
      <text x="90" y="58" fill="#4ade80" font-size="11" font-weight="700">✓ UPI Verified</text>
    </g>

    <!-- Top Right: Win Amount Box -->
    <g transform="translate(390, 0)">
      <rect x="0" y="0" width="230" height="105" rx="20" fill="url(#cardGrad)" stroke="#22c55e" stroke-width="2" filter="url(#neonGlow)" />
      
      <text x="20" y="30" fill="#94a3b8" font-size="13" font-weight="700" letter-spacing="0.5">WIN AMOUNT</text>
      <text x="20" y="68" fill="#ffffff" font-size="36" font-weight="800">₹50.00</text>
      
      <!-- Instant Withdraw Small Button -->
      <rect x="135" y="68" width="80" height="26" rx="8" fill="url(#btnGrad)" />
      <text x="175" y="85" fill="#052c65" font-size="11" font-weight="800" text-anchor="middle">Withdraw</text>
    </g>
  </g>

  <!-- Divider Line -->
  <line x1="90" y1="210" x2="710" y2="210" stroke="#1e293b" stroke-width="2" />

  <!-- Title / Instruction Banner -->
  <g transform="translate(90, 230)">
    <text x="0" y="25" fill="#ffffff" font-size="24" font-weight="800">Watch Ads &amp; Claim Tickets</text>
    <text x="0" y="48" fill="#64748b" font-size="14" font-weight="500">Complete daily ad tasks to win instant ticket rewards</text>
  </g>

  <!-- LIST OF 5 TICKET CARDS -->
  
  <!-- Ticket Card 1 -->
  <g transform="translate(90, 310)">
    <rect x="0" y="0" width="620" height="120" rx="22" fill="url(#cardGrad)" stroke="url(#borderGrad)" stroke-width="2" />
    <rect x="0" y="0" width="10" height="120" rx="5" fill="#22c55e" />
    
    <!-- Ticket Number Circle -->
    <circle cx="50" cy="60" r="26" fill="#1e293b" stroke="#334155" stroke-width="2" />
    <text x="50" y="68" fill="#4ade80" font-size="22" font-weight="800" text-anchor="middle">1</text>
    
    <!-- Ticket Text -->
    <text x="95" y="52" fill="#ffffff" font-size="20" font-weight="700">1 Ad dekho aur jito</text>
    <text x="95" y="82" fill="#22c55e" font-size="24" font-weight="800">₹10 ki ticket</text>
    
    <!-- Action Button -->
    <rect x="440" y="38" width="155" height="48" rx="14" fill="url(#btnGrad)" />
    <text x="517" y="68" fill="#030712" font-size="15" font-weight="800" text-anchor="middle">Watch Ad 1</text>
  </g>

  <!-- Ticket Card 2 -->
  <g transform="translate(90, 450)">
    <rect x="0" y="0" width="620" height="120" rx="22" fill="url(#cardGrad)" stroke="url(#borderGrad)" stroke-width="2" />
    <rect x="0" y="0" width="10" height="120" rx="5" fill="#22c55e" />
    
    <circle cx="50" cy="60" r="26" fill="#1e293b" stroke="#334155" stroke-width="2" />
    <text x="50" y="68" fill="#4ade80" font-size="22" font-weight="800" text-anchor="middle">2</text>
    
    <text x="95" y="52" fill="#ffffff" font-size="20" font-weight="700">2 Ad dekho aur jito</text>
    <text x="95" y="82" fill="#22c55e" font-size="24" font-weight="800">₹20 ki ticket</text>
    
    <rect x="440" y="38" width="155" height="48" rx="14" fill="url(#btnGrad)" />
    <text x="517" y="68" fill="#030712" font-size="15" font-weight="800" text-anchor="middle">Watch Ad 2</text>
  </g>

  <!-- Ticket Card 3 -->
  <g transform="translate(90, 590)">
    <rect x="0" y="0" width="620" height="120" rx="22" fill="url(#cardGrad)" stroke="url(#borderGrad)" stroke-width="2" />
    <rect x="0" y="0" width="10" height="120" rx="5" fill="#22c55e" />
    
    <circle cx="50" cy="60" r="26" fill="#1e293b" stroke="#334155" stroke-width="2" />
    <text x="50" y="68" fill="#4ade80" font-size="22" font-weight="800" text-anchor="middle">3</text>
    
    <text x="95" y="52" fill="#ffffff" font-size="20" font-weight="700">3 Ad dekho aur jito</text>
    <text x="95" y="82" fill="#22c55e" font-size="24" font-weight="800">₹30 ki ticket</text>
    
    <rect x="440" y="38" width="155" height="48" rx="14" fill="url(#btnGrad)" />
    <text x="517" y="68" fill="#030712" font-size="15" font-weight="800" text-anchor="middle">Watch Ad 3</text>
  </g>

  <!-- Ticket Card 4 -->
  <g transform="translate(90, 730)">
    <rect x="0" y="0" width="620" height="120" rx="22" fill="url(#cardGrad)" stroke="url(#borderGrad)" stroke-width="2" />
    <rect x="0" y="0" width="10" height="120" rx="5" fill="#22c55e" />
    
    <circle cx="50" cy="60" r="26" fill="#1e293b" stroke="#334155" stroke-width="2" />
    <text x="50" y="68" fill="#4ade80" font-size="22" font-weight="800" text-anchor="middle">4</text>
    
    <text x="95" y="52" fill="#ffffff" font-size="20" font-weight="700">4 Ad dekho aur jito</text>
    <text x="95" y="82" fill="#22c55e" font-size="24" font-weight="800">₹40 ki ticket</text>
    
    <rect x="440" y="38" width="155" height="48" rx="14" fill="url(#btnGrad)" />
    <text x="517" y="68" fill="#030712" font-size="15" font-weight="800" text-anchor="middle">Watch Ad 4</text>
  </g>

  <!-- Ticket Card 5 -->
  <g transform="translate(90, 870)">
    <rect x="0" y="0" width="620" height="120" rx="22" fill="url(#cardGrad)" stroke="url(#borderGrad)" stroke-width="2" />
    <rect x="0" y="0" width="10" height="120" rx="5" fill="#f59e0b" />
    
    <circle cx="50" cy="60" r="26" fill="#1e293b" stroke="#334155" stroke-width="2" />
    <text x="50" y="68" fill="#fbbf24" font-size="22" font-weight="800" text-anchor="middle">5</text>
    
    <text x="95" y="52" fill="#ffffff" font-size="20" font-weight="700">5 Ad dekho aur jito</text>
    <text x="95" y="82" fill="#fbbf24" font-size="24" font-weight="800">₹50 ki ticket</text>
    
    <rect x="440" y="38" width="155" height="48" rx="14" fill="url(#goldGrad)" />
    <text x="517" y="68" fill="#030712" font-size="15" font-weight="800" text-anchor="middle">Watch Ad 5</text>
  </g>

  <!-- FOOTER NOTICE CARD -->
  <g transform="translate(90, 1030)">
    <rect x="0" y="0" width="620" height="100" rx="20" fill="#1e293b" fill-opacity="0.6" stroke="#f59e0b" stroke-width="1.5" stroke-dasharray="6,4" />
    
    <!-- Warning Icon -->
    <circle cx="45" cy="50" r="18" fill="#f59e0b" fill-opacity="0.2" />
    <text x="45" y="56" fill="#fbbf24" font-size="18" font-weight="800" text-anchor="middle">!</text>
    
    <!-- Footer Text -->
    <text x="80" y="44" fill="#fbbf24" font-size="16" font-weight="800" letter-spacing="0.3">DAILY LIMIT RULES</text>
    <text x="80" y="68" fill="#94a3b8" font-size="15" font-weight="600">Limit: You can only buy 5 tickets ticket and amount</text>
  </g>

  <!-- Bottom Navigation Indicator (Mobile Bar) -->
  <rect x="330" y="1285" width="140" height="5" rx="2.5" fill="#475569" />
</svg>
